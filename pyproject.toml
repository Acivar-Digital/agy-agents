[project]
name = "agy-agents"
version = "1.2.0"
description = "Autonomous Deep Research Council and Code Refactoring Agents powered by Google Gemini & LiteRouter"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Acivar Digital", email = "contact@acivardigital.com" }
]
keywords = [
    "ai-agents",
    "deep-research",
    "code-refactoring",
    "google-gemini",
    "antigravity",
    "literouter",
    "llm-tools",
    "mcp",
    "autonomous-agents",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "h2>=4.1.0",
    "pydantic>=2.10.0",
    "fastmcp>=0.4.1",
]

[project.scripts]
agy-research = "deep_research:run_deep_research"
agy-refactor = "refactor:main"
agy-mcp = "mcp_server:main"

[project.urls]
Homepage = "https://github.com/Acivar-Digital/agy-agents"
Repository = "https://github.com/Acivar-Digital/agy-agents.git"
Documentation = "https://github.com/Acivar-Digital/agy-agents#readme"
"Bug Tracker" = "https://github.com/Acivar-Digital/agy-agents/issues"

[tool.hatch.build.targets.wheel]
only-include = ["deep_research.py", "deep-research", "refactor", "mcp_server.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
