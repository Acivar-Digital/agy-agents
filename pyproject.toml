[project]
name = "agy-agents"
version = "0.1.0"
description = "Autonomous Deep Research and Code Refactoring Agents powered by Google Gemini & LiteRouter"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "h2>=4.1.0",
]

[tool.hatch.build.targets.wheel]
only-include = ["deep-research", "refactor"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
